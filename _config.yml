# LJT-Homepage configuration.
# Personal values below are limited to the information recorded in memory.

title: "Junteng Liu"
name: &name "Junteng Liu"
description: &description "First-year PhD candidate at HKUST NLP Group working on natural language processing, machine learning, LLM reasoning and reinforcement learning, VLM hallucination, and LLM truthfulness and interpretability."

url: "https://bitbreembroider.github.io"
baseurl: "/LJT-Homepage"
repository: "Bitbreembroider/LJT-Homepage"
locale: "en-US"

markdown: kramdown
highlighter: rouge
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-paginate
  - jemoji

feed:
  path: feed.xml

author:
  name: "Junteng Liu"
  avatar: "https://github.com/Vicent0205.png?size=240"
  bio: "First-year PhD candidate at HKUST NLP Group researching NLP, ML, LLM reasoning and reinforcement learning, VLM hallucination, and LLM truthfulness and interpretability."
  location: "The Hong Kong University of Science and Technology"
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"

collections:
  publications:
    output: true
    permalink: /publications/:name/
  talks:
    output: true
    permalink: /talks/:name/
  teaching:
    output: true
    permalink: /teaching/:name/
  portfolio:
    output: true
    permalink: /portfolio/:name/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: "single"
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: "single"
      author_profile: true
      share: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: "single"
      author_profile: true
      share: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: "single"
      author_profile: true
      share: true

publication_category:
  manuscripts:
    title: "Recorded Publications"
  conferences:
    title: "Conference Publications"

exclude:
  - .devcontainer
  - .github
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - docker-compose.yaml
  - Dockerfile
  - README.md
  - AGENTS.md
  - talkmap.ipynb
  - talkmap_out.ipynb
  - talkmap.py
  - scripts
  - markdown_generator

include:
  - .htaccess
  - _pages

keep_files:
  - .git
  - .svn

timezone: "Asia/Hong_Kong"
